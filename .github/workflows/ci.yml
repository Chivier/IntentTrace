name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: intenttrace
          POSTGRES_USER: intenttrace
          POSTGRES_PASSWORD: intenttrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intenttrace -d intenttrace"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.2.14-alpine@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://intenttrace:intenttrace@127.0.0.1:5432/intenttrace
      REDIS_URL: redis://127.0.0.1:6379
      PROVIDER_MODE: mock
      PROVIDER_EGRESS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      # pnpm must exist before setup-node runs: `cache: pnpm` shells out to pnpm
      # to resolve the store path, so installing it afterwards fails the step.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      # @intenttrace/desktop's typecheck and build both run the Tauri bundle
      # preflight, which asserts the stack archive exists. The archive is
      # generated, not committed, so it has to be built before those steps.
      - run: pnpm desktop:prepare
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:contract
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm docs:check
      - run: pnpm schema:check
      - run: pnpm docker:check
      - run: pnpm db:migrate && pnpm db:migrate
